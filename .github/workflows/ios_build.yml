name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r StompPedalApp.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: StompPedalApp
          path: build/ios/iphoneos/StompPedalApp.ipa
